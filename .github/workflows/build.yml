name: Build Specific Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile 5.10.236 Bypass Only
        run: |
          echo "Starting custom target compilation..."
          ./build.sh --version "5.10.236-android12" --variant "bypass"
